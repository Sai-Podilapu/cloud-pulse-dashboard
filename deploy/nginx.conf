server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /auth/change-password {
        proxy_pass http://127.0.0.1:8082/change-password;
        proxy_set_header Host $host;
    }

    location = /auth/register {
        proxy_pass http://127.0.0.1:8082/register;
        proxy_set_header Host $host;
    }

    location /alerts-api/ {
        auth_basic "CloudPulse";
        auth_basic_user_file /etc/cloudpulse/htpasswd;
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
    }

    location /dashboards-api/ {
        auth_basic "CloudPulse";
        auth_basic_user_file /etc/cloudpulse/htpasswd;
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
    }

    location /grafana/ {
        auth_basic "CloudPulse";
        auth_basic_user_file /etc/cloudpulse/htpasswd;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${GRAFANA_TOKEN}";
    }
}
